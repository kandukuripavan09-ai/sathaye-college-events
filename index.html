<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sathaye College Events & Clubs</title>
<meta name="description" content="Sathaye College Events & Clubs Portal">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1226;--surface:#171D3A;--ink:#EEF0FA;--muted:#A3AACB;--brand:#4C63E0;--on:#FFFFFF;--accent:#F0B429;--line:#2B3361;--ok:#4ADE9F}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif}h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.wrap{max-width:1040px;margin:auto;padding:0 20px}header{background:var(--brand);color:var(--on)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;max-width:1040px;margin:auto;flex-wrap:wrap}.brand{font:700 15px/1.2 "Bricolage Grotesque",sans-serif;text-decoration:none}.brand small{display:block;font:400 12px "Source Sans 3",sans-serif;opacity:.8}nav{display:flex;gap:4px;flex-wrap:wrap}nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px}nav a[aria-current=page]{background:var(--accent);color:#FFFFFF}.hero{background:var(--brand);color:var(--on);padding:36px 0 56px}.hero .wrap{display:grid;gap:32px;grid-template-columns:1.1fr .9fr;align-items:center}.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800}.hero p{max-width:46ch;opacity:.9}.board{background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 18px;border-top:6px solid var(--accent)}.board h3{font-size:15px;padding:12px 0 4px;color:var(--muted)}.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.date{min-width:54px;text-align:center;font:800 24px/1 "Bricolage Grotesque",sans-serif}.date small{display:block;font:600 12px "Source Sans 3",sans-serif;color:var(--muted)}.row b{display:block}.row span{color:var(--muted);font-size:15px}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:#141B3A;text-decoration:none}.btn.alt{background:var(--brand);color:var(--on)}.btn.line{background:transparent;border:2px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.7;cursor:default}section.pg{padding:36px 0 64px}h2{font-size:clamp(26px,4vw,38px);margin-bottom:6px}.sub{color:var(--muted);margin:0 0 22px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin:-26px 0 30px}.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 22px}.stats b{font:800 28px "Bricolage Grotesque",sans-serif;display:block}.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}.card h3{font-size:21px}.card p{margin:0;color:var(--muted);font-size:15px}.card .btn{margin-top:auto;align-self:flex-start}.tag{align-self:flex-start;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}.tools input{flex:1;min-width:200px;width:auto}.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer}.chip[aria-pressed=true]{background:var(--brand);color:var(--on);border-color:var(--brand)}form{display:grid;gap:12px;max-width:480px}label{font-weight:600;font-size:15px;display:grid;gap:4px}.ok{color:var(--ok);font-weight:600}.two{display:grid;gap:28px;grid-template-columns:1fr 1fr}.shots{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.shot{aspect-ratio:4/3;border-radius:12px;border:0;color:#fff;font:700 18px "Bricolage Grotesque",sans-serif;padding:14px;display:flex;align-items:flex-end;text-align:left;cursor:pointer}.news{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:36px;display:grid;gap:10px}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:15px}@media(max-width:760px){.hero .wrap,.two{grid-template-columns:1fr}}
</style></head><body>
<header><div class="bar"><a class="brand" href="#/home">Sathaye College<small>Events &amp; Clubs Portal</small></a><nav id="nav"><a href="#/home">Home</a><a href="#/events">Events</a><a href="#/clubs">Clubs</a><a href="#/gallery">Gallery</a><a href="#/contact">Contact</a></nav></div></header>
<main id="app"></main><footer><div class="wrap">Parle Tilak Vidyalaya Association's Sathaye College, Vile Parle (East), Mumbai. Student project for web analytics.</div></footer>
<script>
const EV=[
{id:1,t:"Code Sprint Hackathon",c:"Tech",d:"2026-11-14",v:"Seminar Hall",club:"Coding Club",x:"A 12-hour team hackathon. Build something useful for campus life; mentors from industry will review your demos."},
{id:2,t:"Diwali Cultural Night",c:"Cultural",d:"2026-11-08",v:"Main Auditorium",club:"Cultural Committee",x:"Dance, music and drama performances by students, followed by an open mic."},
{id:3,t:"Inter-Collegiate Cricket Cup",c:"Sports",d:"2026-11-21",v:"College Ground",club:"Sports Club",x:"Eight college teams, knockout format. Register your team of 11 plus 3 reserves."},
{id:4,t:"Resume and LinkedIn Workshop",c:"Workshop",d:"2026-10-24",v:"Room 204",club:"Placement Cell",x:"Build a one-page resume and a profile recruiters respond to. Bring a laptop."},
{id:5,t:"Photography Walk: Mumbai Streets",c:"Cultural",d:"2026-11-02",v:"Meets at Main Gate",club:"Photography Club",x:"A guided morning walk with a camera or phone. Best frames are exhibited in the gallery."},
{id:6,t:"Data Analytics Bootcamp",c:"Tech",d:"2026-12-05",v:"Computer Lab 2",club:"Data Science Club",x:"Hands-on Google Analytics and Excel session using real website data."},
{id:7,t:"Blood Donation Camp",c:"Social",d:"2026-12-10",v:"College Hall",club:"NSS Unit",x:"Donate blood and help local hospitals. A doctor is on site; carry your college ID."},
{id:8,t:"Annual Debate Championship",c:"Workshop",d:"2026-12-18",v:"Room 101",club:"Debate Society",x:"Prepared and extempore rounds on current affairs. Open to all years."}];
const CL=[["Coding Club","Tech","Weekly projects, hackathons and peer coding sessions."],["Cultural Committee","Cultural","Plans fests, dance, music and drama events."],["Sports Club","Sports","Teams, practice slots and tournaments."],["Photography Club","Cultural","Photo walks, editing sessions and exhibitions."],["Data Science Club","Tech","Analytics, dashboards and small data projects."],["NSS Unit","Social","Community drives, camps and volunteering."],["Debate Society","Workshop","Debates, public speaking and quiz nights."]];
const CATS=["All","Tech","Cultural","Sports","Workshop","Social"],$=s=>document.querySelector(s),app=$("#app");
let state={cat:"All",q:""},joined={};
let AB="A";try{AB=localStorage.getItem("ab")||(Math.random()<.5?"A":"B");localStorage.setItem("ab",AB)}catch(e){}
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>{const x=new Date(d+"T00:00");return[x.getDate(),x.toLocaleString("en",{month:"short"})]};
const STORE="sathaye_analytics_events_v2",REGSTORE="sathaye_registrations_v2";
let REG=[];try{REG=JSON.parse(localStorage.getItem(REGSTORE)||"[]")}catch(e){}
const saveReg=()=>{try{localStorage.setItem(REGSTORE,JSON.stringify(REG))}catch(e){}};
const sid=(()=>{try{let x=sessionStorage.getItem("sathaye_sid");if(!x){x=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();sessionStorage.setItem("sathaye_sid",x)}return x}catch(e){return "session-"+Date.now()}})();
const device=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?"mobile":"desktop";
function readEvents(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function writeEvent(name,p={}){const item={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random()),name,ts:new Date().toISOString(),session:sid,device,page:location.hash.replace("#/","")||"home",...p};try{const a=readEvents();a.push(item);localStorage.setItem(STORE,JSON.stringify(a.slice(-10000)))}catch(e){}
 if(window.dataLayer)window.dataLayer.push({event:name,...p});
 if(typeof gtag==="function")gtag("event",name,p);
 if(typeof clarity==="function")clarity("event",name);
}
function track(name,p={}){writeEvent(name,{ab_variant:AB,...p})}
let currentPage=null,pageStarted=Date.now();
function startPage(page){if(currentPage!==null){const seconds=Math.max(0,Math.round((Date.now()-pageStarted)/1000));track("page_time",{page_path:currentPage,duration_seconds:seconds})}currentPage=page;pageStarted=Date.now();track("page_view",{page_path:"/"+page,page_title:document.title,utm_source:new URLSearchParams(location.search).get("utm_source")||"direct",utm_medium:new URLSearchParams(location.search).get("utm_medium")||"none",utm_campaign:new URLSearchParams(location.search).get("utm_campaign")||"none"})}
function regLabel(){return AB==="A"?"Register":"Reserve my seat"}
function evCard(e){const[dd,mm]=fmt(e.d);return`<article class="card"><span class="tag">${e.c}</span><h3>${esc(e.t)}</h3><p>${dd} ${mm} · ${esc(e.v)}</p><p>By ${esc(e.club)}</p><button type="button" class="btn" data-reg="${e.id}">${regLabel()}</button></article>`}
function home(){const up=[...EV].sort((a,b)=>a.d>b.d?1:-1).slice(0,3);return`<div class="hero"><div class="wrap"><div><h1>What's happening at Sathaye College</h1><p>Find events, join clubs and register in a minute.</p><p><a class="btn" href="#/events" data-cta="browse_events">Browse events</a></p></div><div class="board"><h3>Coming up next</h3>${up.map(e=>{const[d,m]=fmt(e.d);return`<a class="row" style="text-decoration:none" href="#/event/${e.id}" data-feat="${e.id}"><div class="date">${d}<small>${m}</small></div><div><b>${esc(e.t)}</b><span>${esc(e.v)}</span></div></a>`}).join("")}</div></div></div><section class="pg"><div class="wrap"><div class="stats"><div><b>${EV.length}</b>upcoming events</div><div><b>${CL.length}</b>active clubs</div><div><b>${EV.filter(e=>e.c==="Tech").length}</b>tech events</div></div><h2>Featured events</h2><p class="sub">Registrations are open for these.</p><div class="grid">${EV.slice(0,3).map(evCard).join("")}</div><div class="news"><h3>Get event updates</h3><form id="nl"><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><button class="btn alt">Subscribe</button><span class="ok" id="nlm" role="status"></span></form></div></div></section>`}
function events(){const f=EV.filter(e=>(state.cat==="All"||e.c===state.cat)&&e.t.toLowerCase().includes(state.q.toLowerCase()));return`<section class="pg"><div class="wrap"><h2>Events</h2><p class="sub">Search or filter, then register.</p><div class="tools"><input id="q" type="search" placeholder="Search events" value="${esc(state.q)}" aria-label="Search events">${CATS.map(c=>`<button type="button" class="chip" data-cat="${c}" aria-pressed="${state.cat===c}">${c}</button>`).join("")}</div><div class="grid" id="evg">${f.length?f.map(evCard).join(""):"<p>No events match.</p>"}</div></div></section>`}
function detail(id){const e=EV.find(x=>x.id==id);if(!e)return events();const[d,m]=fmt(e.d);return`<section class="pg"><div class="wrap two"><div><a href="#/events">Back to events</a><h2 style="margin-top:12px">${esc(e.t)}</h2><p><span class="tag">${e.c}</span></p><p>${esc(e.x)}</p><p><b>When:</b> ${d} ${m}, 2026<br><b>Where:</b> ${esc(e.v)}<br><b>Organizer:</b> ${esc(e.club)}</p><button type="button" class="btn line" data-share="${e.id}">Share this event</button> <span class="ok" id="shm" role="status"></span></div><div class="card"><h3>${regLabel()}</h3><form id="rsvp" data-id="${e.id}"><label>Full name<input name="n" required></label><label>Department<select name="dp"><option>Science</option><option>Commerce</option><option>Arts</option><option>IT / CS</option></select></label><label>Year<select name="y"><option>FY</option><option>SY</option><option>TY</option></select></label><button class="btn alt">Confirm registration</button><span class="ok" id="rsm" role="status"></span></form></div></div></section>`}
function clubs(){return`<section class="pg"><div class="wrap"><h2>Clubs</h2><p class="sub">Pick a club and join.</p><div class="grid">${CL.map((c,i)=>`<article class="card"><span class="tag">${c[1]}</span><h3>${c[0]}</h3><p>${c[2]}</p><button type="button" class="btn alt" data-join="${i}" ${joined[i]?"disabled":""}>${joined[i]?"Joined":"Join club"}</button></article>`).join("")}</div></div></section>`}
function gallery(){const g=["#4C63E0,#6E82F2","#253A9A,#4C63E0","#1D2A6B,#4C63E0","#384DB4,#7184F0","#5B4A9A,#8E6CE0","#2E6F40,#58B368"],n=["Diwali Night 2025","Hackathon 2025","Cricket Cup","Photo Walk","Blood Donation Camp","Annual Day"];return`<section class="pg"><div class="wrap"><h2>Gallery</h2><p class="sub">Moments from past events.</p><div class="shots">${n.map((t,i)=>`<button type="button" class="shot" data-g="${esc(t)}" style="background:linear-gradient(135deg,${g[i]})">${t}</button>`).join("")}</div></div></section>`}
function contact(){return`<section class="pg"><div class="wrap"><h2>Contact and feedback</h2><p class="sub">Suggest an event or tell us what to improve.</p><form id="fb"><label>Name<input name="n" required></label><label>Email<input type="email" name="e" required></label><label>Message<textarea name="m" rows="4" required></textarea></label><button class="btn alt">Send feedback</button><span class="ok" id="fbm" role="status"></span></form></div></section>`}
function route(){const h=location.hash.replace("#/","")||"home",[p,id]=h.split("/");app.innerHTML=p==="events"?events():p==="event"?detail(id):p==="clubs"?clubs():p==="gallery"?gallery():p==="contact"?contact():home();document.querySelectorAll("#nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#/"+(p==="event"?"events":p)));document.title=({home:"Home",events:"Events",event:"Event details",clubs:"Clubs",gallery:"Gallery",contact:"Contact"}[p]||"Home")+" | Sathaye College Events";window.scrollTo(0,0);startPage(h);if(p==="events"){const q=$("#q");q.oninput=e=>{state.q=e.target.value;const box=$("#evg");box.innerHTML=events().match(/<div class="grid" id="evg">([\s\S]*?)<\/div><\/div><\/section>$/)[1];clearTimeout(window.qt);window.qt=setTimeout(()=>track("search_used",{term:state.q}),500)}}}
function done(id,msg){const el=$("#"+id);if(el)el.textContent=msg}
document.addEventListener("click",e=>{const t=e.target.closest("[data-reg],[data-cat],[data-join],[data-share],[data-g],[data-cta],[data-feat]");if(!t)return;const d=t.dataset;if(d.reg){const ev=EV.find(x=>x.id==d.reg);if(!ev)return;track("event_register_click",{event_id:ev.id,event_name:ev.t,category:ev.c,button_label:t.textContent.trim()});location.hash="#/event/"+d.reg}else if(d.cat){state.cat=d.cat;track("filter_applied",{category:d.cat});route()}else if(d.join){const c=CL[Number(d.join)];if(!c)return;joined[d.join]=1;track("club_join_click",{club:c[0],category:c[1]});t.textContent="Joined";t.disabled=true}else if(d.share){const ev=EV.find(x=>x.id==d.share);track("share_click",{event_name:ev.t});if(navigator.clipboard)navigator.clipboard.writeText(location.href).catch(()=>{});done("shm","Link copied!")}else if(d.g)track("gallery_click",{photo:d.g});else if(d.cta)track("cta_click",{cta:d.cta});else if(d.feat)track("featured_event_click",{event_id:d.feat})});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;if(f.id==="nl"){track("newsletter_signup");done("nlm","Subscribed. Check your inbox.");f.reset()}else if(f.id==="rsvp"){const ev=EV.find(x=>x.id==f.dataset.id);const reg={id:ev.id,ev:ev.t,n:f.n.value,dp:f.dp.value,y:f.y.value,t:new Date().toLocaleString(),session:sid};REG.push(reg);saveReg();track("rsvp_submit",{event_id:ev.id,event_name:ev.t,department:f.dp.value,year:f.y.value});done("rsm","You're registered for "+ev.t+".");f.reset()}else if(f.id==="fb"){track("feedback_submit");done("fbm","Thanks. We got your message.");f.reset()}});
addEventListener("scroll",()=>{const h=document.documentElement,p=Math.round((scrollY+innerHeight)/h.scrollHeight*100);[25,50,75,100].forEach(k=>{const key=currentPage+":"+k;if(p>=k&&!sessionStorage.getItem("sd:"+key)){sessionStorage.setItem("sd:"+key,"1");track("scroll_depth",{percent:k,page_path:currentPage})}})},{passive:true});
addEventListener("beforeunload",()=>{if(currentPage!==null)track("page_time",{page_path:currentPage,duration_seconds:Math.max(0,Math.round((Date.now()-pageStarted)/1000))})});addEventListener("hashchange",route);route();
</script></body></html>
